---
# Grafana Dashboards Configuration
apiVersion: 1

providers:
  - name: 'Default'
    orgId: 1
    folder: 'QBittorrent VPN'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
