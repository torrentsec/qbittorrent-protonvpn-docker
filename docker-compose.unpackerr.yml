# ──────────────────────────────────────────────────────────────────────
# 📦 Unpackerr - Automatic Archive Extraction
# ──────────────────────────────────────────────────────────────────────
# Automatically extracts .rar, .zip, and other archives downloaded by
# your Arr applications, then cleans up the archives.
#
# To enable: docker-compose -f docker-compose.yml -f docker-compose.unpackerr.yml up -d
# To disable: Remove this file from the docker-compose command
# ──────────────────────────────────────────────────────────────────────

services:
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped

    # ─── Environment Configuration ─────────────────────────────────────
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

      # Logging
      - UN_DEBUG=false
      - UN_LOG_FILE=/logs/unpackerr.log
      - UN_LOG_FILES=10
      - UN_LOG_FILE_MB=10

      # Intervals
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      - UN_RETRY_DELAY=5m
      - UN_MAX_RETRIES=3

      # Parallel extraction
      - UN_PARALLEL=1

      # Archive cleanup (delete after extraction)
      - UN_DELETE_AFTER=10m

      # Sonarr Integration (configure if using Sonarr)
      - UN_SONARR_0_URL=http://gluetun:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY:-}
      - UN_SONARR_0_PATHS_0=/downloads
      - UN_SONARR_0_PROTOCOLS=torrent
      - UN_SONARR_0_TIMEOUT=10s
      - UN_SONARR_0_DELETE_DELAY=5m

      # Radarr Integration (configure if using Radarr)
      - UN_RADARR_0_URL=http://gluetun:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY:-}
      - UN_RADARR_0_PATHS_0=/downloads
      - UN_RADARR_0_PROTOCOLS=torrent
      - UN_RADARR_0_TIMEOUT=10s
      - UN_RADARR_0_DELETE_DELAY=5m

      # Lidarr Integration (configure if using Lidarr)
      - UN_LIDARR_0_URL=http://gluetun:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY:-}
      - UN_LIDARR_0_PATHS_0=/downloads
      - UN_LIDARR_0_PROTOCOLS=torrent
      - UN_LIDARR_0_TIMEOUT=10s
      - UN_LIDARR_0_DELETE_DELAY=5m

      # Readarr Integration (configure if using Readarr)
      - UN_READARR_0_URL=http://gluetun:8787
      - UN_READARR_0_API_KEY=${READARR_API_KEY:-}
      - UN_READARR_0_PATHS_0=/downloads
      - UN_READARR_0_PROTOCOLS=torrent
      - UN_READARR_0_TIMEOUT=10s
      - UN_READARR_0_DELETE_DELAY=5m

    # ─── Persistent Storage ────────────────────────────────────────────
    volumes:
      - ./unpackerr:/config
      - ./downloads:/downloads
      - ./unpackerr/logs:/logs

    # ─── Network Configuration ─────────────────────────────────────────
    # Uses bridge network to communicate with Arr apps through Gluetun
    network_mode: bridge

    # ─── Security Options ──────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true

    # ─── Resource Limits (Optional) ────────────────────────────────────
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
